<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/app.js" defer></script>
<script src="assets/js/contact.js" defer></script>
</head>
<body>
<!-- Fond, en-tête, pied de page et notification : injectés par assets/js/app.js -->
<main id="main">
<section class="page">
  <div class="wrap">
    <h1 class="title">Parler de mon projet</h1>
    <p class="page-lead">Décrivez votre besoin en quelques lignes. Seules les informations utiles sont demandées.</p>
    <div class="contact-grid">
      <form class="form" id="devis" autocomplete="on">
        <div class="two">
          <label>Nom<input type="text" name="nom" required autocomplete="name"></label>
          <label><span>Entreprise <span class="opt">(facultatif)</span></span><input type="text" name="entreprise" autocomplete="organization"></label>
        </div>
        <div class="two">
          <label>Email<input type="email" name="email" required autocomplete="email"></label>
          <label>Type de projet<select name="type" required><option value="">Choisir…</option><option>Création de site vitrine</option><option>Refonte de site</option><option>Développement sur mesure</option><option>Maintenance</option><option>Autre ou je ne sais pas encore</option></select></label>
        </div>
        <label>Votre besoin<textarea name="besoin" required placeholder="Votre activité, ce que vous attendez du site, vos délais éventuels…"></textarea></label>
        <label><span>Budget indicatif <span class="opt">(facultatif)</span></span><input type="text" name="budget"></label>
        <div class="hp" aria-hidden="true"><label>Ne pas remplir<input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
        <button class="btn fill" type="submit">Envoyer ma demande</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
      <div class="infos">
        <a class="info js-email" href="contact.html"><small>Email</small><span class="ph">[À RENSEIGNER] email professionnel</span></a>
        <a class="info js-linkedin" href="#" target="_blank" rel="noopener noreferrer"><small>LinkedIn</small>Voir mon profil</a>
        <a class="info js-github" href="https://github.com" target="_blank" rel="noopener noreferrer"><small>GitHub</small>Voir mes projets</a>
      </div>
    </div>
  </div>
</section>
</main>
</body>
</html>
